<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Final Chapter 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: una revista abierta sobre fondo negro. En escritorio se ven las dos hojas lado a lado; en celular, una hoja a la vez que gira como página. */
:root {
  --stage: #0A0A0B;
  --ink: #ECEDEF;
  --muted: #9EA2A8;
  --silver: #C8CCD1;
  --line: rgba(200, 204, 209, 0.28);
  --paper: #ECEBE8;
  --display: 'Bodoni Moda', Didot, 'Times New Roman', serif;
  --ui: Montserrat, 'Helvetica Neue', Arial, sans-serif;
  --ratio: 0.5089; /* 1400 / 2751 */
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  box-sizing: border-box;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; }
header { width: 100%; display: flex; align-items: center; gap: 16px; }
header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; letter-spacing: 0.28em; white-space: nowrap; }
header h1 span { font-family: var(--ui); font-weight: 500; font-size: 14px; letter-spacing: 0.36em; color: var(--silver); }
header .rule { flex: 1; height: 1px; background: var(--line); }
header p { margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: 0.32em; color: var(--muted); white-space: nowrap; }

.book { --pw: min(46vw, calc((100dvh - 190px) * var(--ratio)), 560px); display: flex; gap: 0; perspective: 2400px; }
.page { position: relative; width: var(--pw); aspect-ratio: 1400 / 2751; max-width: 100%; background: var(--paper); box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
.page img { display: block; width: 100%; height: 100%; object-fit: cover; }
.page.left { border-radius: 4px 0 0 4px; }
.page.right { border-radius: 0 4px 4px 0; }
.page.left::after, .page.right::after { content: ""; position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; }
.page.left::after { right: 0; background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,0.18)); }
.page.right::after { left: 0; background: linear-gradient(90deg, rgba(0,0,0,0.22), rgba(0,0,0,0)); }
.hot { position: absolute; display: block; border-radius: 4px; outline-offset: 3px; }
.hot:hover { background: rgba(255,255,255,0.06); }
.hot:focus-visible { outline: 2px solid var(--silver); }

.controls { display: none; align-items: center; gap: 14px; }
.controls button { min-width: 44px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: var(--ui); font-size: 11px; font-weight: 500; letter-spacing: 0.28em; cursor: pointer; }
.controls button:disabled { opacity: 0.35; cursor: default; }
.controls button:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }
.folio { font-family: var(--display); font-size: 18px; color: var(--silver); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

.cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.cta a { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 22px; border: 1px solid var(--silver); color: var(--ink); text-decoration: none; font-size: 11.5px; font-weight: 500; letter-spacing: 0.3em; }
.cta a.solid { background: linear-gradient(100deg, #9EA2A8 0%, #F4F5F7 35%, #BFC3C8 60%, #E9EBEE 80%, #A3A7AD 100%); color: #0A0A0B; border-color: transparent; font-weight: 600; }
.cta a:focus-visible { outline: 2px solid var(--silver); outline-offset: 3px; }
.note { margin: 0; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-align: center; }

@media (max-width: 760px) {
  .book { --pw: min(100%, calc((100dvh - 230px) * var(--ratio)), 520px); position: relative; width: var(--pw); aspect-ratio: 1400 / 2751; }
  .page { position: absolute; inset: 0; width: 100%; border-radius: 4px; backface-visibility: hidden; transform-origin: left center; transition: transform 0.7s cubic-bezier(.3,.7,.2,1), opacity 0.7s; }
  .page::after { display: none; }
  .book[data-p="1"] .page.right { transform: rotateY(-92deg); opacity: 0; pointer-events: none; }
  .book[data-p="2"] .page.left { transform: rotateY(92deg); transform-origin: right center; opacity: 0; pointer-events: none; }
  .controls { display: flex; }
  header p { display: none; }
}
@media (prefers-reduced-motion: reduce) { .page { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>THE FINAL CHAPTER <span>2026</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p>JUEVES 3 DE DICIEMBRE · ESPACIO GANEM</p>
  </header>

  <div class="book" id="book" data-p="1">
    <figure class="page left" style="margin:0">
      <img id="img1" src="p01.gif" alt="Página 01, Cómo llegar: mapa de la ruta en auto desde Samara por Av. Santa Fe hasta Espacio Ganem, piso 14. Acceso en auto por Av. Santa Fe 483 y sin coche por Prolongación Reforma 1196. Jueves 3 de diciembre de 6:00 a 11:00 p. m.">
      <a class="hot" style="left:63%;top:62.5%;width:26%;height:6.6%" href="https://www.google.com/maps/dir/Samara+Shops+Santa+Fe/19.3595234,-99.2719106" target="_blank" rel="noopener" aria-label="Abrir la ruta en Google Maps"></a>
      <a class="hot" style="left:11.5%;top:21.2%;width:77%;height:27%" href="https://www.google.com/maps/dir/Samara+Shops+Santa+Fe/19.3595234,-99.2719106" target="_blank" rel="noopener" aria-label="Abrir el mapa en Google Maps"></a>
    </figure>
    <figure class="page right" style="margin:0">
      <img id="img2" src="p02.gif" alt="Página 02, Dress code Black and Silver, Night Out Chic: looks en negro para ellas y ellos, con detalles y accesorios plateados de Todomoda e Isadora.">
    </figure>
  </div>

  <div class="controls" role="group" aria-label="Cambiar de página">
    <button id="prev" type="button" aria-label="Página anterior">←</button>
    <span class="folio" id="folio" aria-live="polite">01 / 02</span>
    <button id="next" type="button" aria-label="Página siguiente">→</button>
  </div>

  <div class="cta">
    <a class="solid" href="https://www.google.com/maps/dir/Samara+Shops+Santa+Fe/19.3595234,-99.2719106" target="_blank" rel="noopener">ABRIR RUTA EN GOOGLE MAPS</a>
  </div>
  <p class="note">Toca el mapa o el QR para abrir la ruta desde tu celular.</p>
</div>

<script>
(function () {
  var book = document.getElementById('book');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var folio = document.getElementById('folio');
  function restart(id) {
    var img = document.getElementById(id);
    var src = img.getAttribute('src');
    img.setAttribute('src', '');
    requestAnimationFrame(function () { img.setAttribute('src', src); });
  }
  function go(p) {
    book.dataset.p = String(p);
    folio.textContent = '0' + p + ' / 02';
    prev.disabled = p === 1;
    next.disabled = p === 2;
    restart(p === 1 ? 'img1' : 'img2');
  }
  prev.addEventListener('click', function () { go(1); });
  next.addEventListener('click', function () { go(2); });
  var x0 = null;
  book.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  book.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) < 40) return;
    go(dx < 0 ? 2 : 1);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(2);
    if (e.key === 'ArrowLeft') go(1);
  });
  prev.disabled = true;
})();
</script>

</body>
</html>
